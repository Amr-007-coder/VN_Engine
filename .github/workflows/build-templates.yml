name: Build selected game templates and editor packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-options:
    name: Read build selection from release tag
    runs-on: ubuntu-22.04
    outputs:
      platforms: ${{ steps.options.outputs.platforms }}
      platform_csv: ${{ steps.options.outputs.platform_csv }}
      editor_template_csv: ${{ steps.options.outputs.editor_template_csv }}
      internal_web_template: ${{ steps.options.outputs.internal_web_template }}
      build_editor: ${{ steps.options.outputs.build_editor }}
      build_android_apk: ${{ steps.options.outputs.build_android_apk }}
      matrix: ${{ steps.options.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Read release options
        id: options
        run: python tools/release.py --read-tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  build-template:
    name: Build ${{ matrix.platform }} template
    needs: release-options
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-options.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux engine build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache

      - name: Install browser audio conversion tool
        if: matrix.platform == 'web'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Windows engine template
        if: matrix.platform == 'windows'
        run: python compile.py --engine-only --output-dir build --output-name Runner.exe --windows-console-mode disable

      - name: Compile Linux engine template
        if: matrix.platform == 'linux'
        run: python compile.py --engine-only --output-dir build --output-name Runner

      - name: Compile macOS engine template
        if: matrix.platform == 'macos'
        run: python compile.py --engine-only --output-dir build --output-name Runner --macos-app-bundle

      - name: Build browser template
        if: matrix.platform == 'web'
        run: python tools/build_web_template.py --output templates/template-web.zip

      - name: Normalize and zip desktop template
        if: matrix.platform != 'web'
        run: >-
          python tools/package_template.py --platform ${{ matrix.platform }}
          --build-dir build --output templates/template-${{ matrix.platform }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform == 'web' && needs.release-options.outputs.internal_web_template == 'true' && 'vn-android-web-template' || format('template-{0}', matrix.platform) }}
          path: templates/template-${{ matrix.platform }}.zip
          if-no-files-found: error

  build-android-apk:
    name: Build Android APK
    needs: [release-options, build-template]
    if: needs.release-options.outputs.build_android_apk == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: template-*
          path: templates
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: needs.release-options.outputs.internal_web_template == 'true'
        with:
          name: vn-android-web-template
          path: templates

      - name: Install Android SDK platform
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build fresh Android app
        run: python main.py --build-game --platform android --templates-dir templates --output-dir exports

      - uses: actions/upload-artifact@v4
        with:
          name: vn-engine-android-apk
          path: exports/*.apk
          if-no-files-found: error

  build-editor:
    name: Build VN_Editor for ${{ matrix.platform }}
    needs: [release-options, build-template]
    if: needs.release-options.outputs.build_editor == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux editor build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache python3-tk python3-venv tk-dev
          python3 -m venv --system-site-packages .editor-venv
          .editor-venv/bin/python -m pip install -r requirements.txt

      - name: Install editor build dependencies
        if: runner.os != 'Linux'
        run: python -m pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: template-*
          path: templates
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: needs.release-options.outputs.internal_web_template == 'true'
        with:
          name: vn-android-web-template
          path: templates

      - name: Build Linux editor
        if: matrix.platform == 'linux'
        run: .editor-venv/bin/python build_editor.py --output-dir build/editor

      - name: Build Windows or macOS editor
        if: matrix.platform != 'linux'
        run: python build_editor.py --output-dir build/editor

      - name: Package Linux editor
        if: matrix.platform == 'linux'
        run: >-
          .editor-venv/bin/python tools/package_editor.py --platform linux
          --build-dir build/editor --templates-dir templates
          --template-platforms "${{ needs.release-options.outputs.editor_template_csv }}"
          --output exports/VN_Editor-linux.zip

      - name: Package Windows or macOS editor
        if: matrix.platform != 'linux'
        run: >-
          python tools/package_editor.py --platform ${{ matrix.platform }}
          --build-dir build/editor --templates-dir templates
          --template-platforms "${{ needs.release-options.outputs.editor_template_csv }}"
          --output exports/VN_Editor-${{ matrix.platform }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vn-editor-${{ matrix.platform }}
          path: exports/VN_Editor-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish-release-assets:
    name: Attach selected templates and editor packages to release
    needs: [release-options, build-template, build-editor, build-android-apk]
    if: >-
      always() &&
      needs.release-options.result == 'success' &&
      needs.build-template.result == 'success' &&
      (needs.build-editor.result == 'success' || needs.build-editor.result == 'skipped') &&
      (needs.build-android-apk.result == 'success' || needs.build-android-apk.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: template-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: needs.release-options.outputs.build_editor == 'true'
        with:
          pattern: vn-editor-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: needs.release-options.outputs.build_android_apk == 'true'
        with:
          name: vn-engine-android-apk
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
