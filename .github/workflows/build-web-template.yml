name: Build web export template

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version release to attach template-web.zip to (for example v1.0.5)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-web-template:
    name: Build browser template with Pygbag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt

      - name: Install OGG conversion tool
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Pygbag build dependencies
        run: python -m pip install -r requirements-web.txt

      - name: Build and package web template
        run: python tools/build_web_template.py --output templates/template-web.zip

      - uses: actions/upload-artifact@v4
        with:
          name: template-web
          path: templates/template-web.zip
          if-no-files-found: error

      - name: Attach web template to the selected release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: templates/template-web.zip
          fail_on_unmatched_files: true
